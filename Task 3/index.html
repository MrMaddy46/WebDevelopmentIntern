<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="A client-side To-Do List application with CRUD operations, filtering, and local data persistence.">

    <title>Task Manager | To-Do List</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="todo-container">

        <header class="todo-header">

            <h1>Task Manager</h1>

            <p>
                Organize your tasks and stay productive.
            </p>

        </header>

        <section
            class="todo-app"
            aria-labelledby="todo-heading">

            <h2 id="todo-heading">
                My Tasks
            </h2>

            <!-- Add Task -->

            <form id="task-form">

                <label for="task-input">
                    Add a new task
                </label>

                <div class="input-group">

                    <input
                        type="text"
                        id="task-input"
                        name="task"
                        placeholder="Enter your task..."
                        maxlength="200"
                        autocomplete="off"
                        required>

                    <button type="submit">
                        Add Task
                    </button>

                </div>

            </form>

            <!-- Filter Buttons -->

            <nav
                class="filters"
                aria-label="Task filters">

                <button
                    type="button"
                    class="filter-btn active"
                    data-filter="all"
                    aria-pressed="true">

                    All

                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="active"
                    aria-pressed="false">

                    Active

                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="completed"
                    aria-pressed="false">

                    Completed

                </button>

            </nav>

            <!-- Task List -->

            <ul
                id="task-list"
                class="task-list"
                aria-live="polite">
            </ul>

            <!-- Task Count -->

            <p
                id="task-count"
                class="task-count"
                aria-live="polite">

                0 tasks remaining

            </p>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
