<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Real-time weather dashboard that displays temperature, humidity and wind speed for any city.">

    <title>Weather Dashboard</title>

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <main class="weather-container">

        <header class="weather-header">

            <h1>Weather Dashboard</h1>

            <p>
                Search for a city to view current weather conditions.
            </p>

        </header>

        <section
            class="search-section"
            aria-labelledby="search-heading">

            <h2 id="search-heading">
                Search City
            </h2>

            <form id="weather-form">

                <label for="city-input">
                    Enter city name
                </label>

                <div class="search-box">

                    <input
                        type="search"
                        id="city-input"
                        placeholder="Example: Chennai"
                        autocomplete="off"
                        required>

                    <button type="submit">
                        Search
                    </button>

                </div>

            </form>

        </section>

        <!-- Status -->

        <p
            id="status-message"
            class="status"
            aria-live="polite">
        </p>

        <!-- Weather Result -->

        <section
            id="weather-result"
            class="weather-result"
            aria-labelledby="city-name"
            hidden>

            <header class="location-header">

                <h2 id="city-name">
                    --
                </h2>

                <p id="country-name">
                    --
                </p>

            </header>

            <div class="weather-grid">

                <article class="weather-card">

                    <h3>
                        Temperature
                    </h3>

                    <p
                        id="temperature"
                        class="weather-value">
                        --
                    </p>

                    <span>
                        °C
                    </span>

                </article>

                <article class="weather-card">

                    <h3>
                        Humidity
                    </h3>

                    <p
                        id="humidity"
                        class="weather-value">
                        --
                    </p>

                    <span>
                        %
                    </span>

                </article>

                <article class="weather-card">

                    <h3>
                        Wind Speed
                    </h3>

                    <p
                        id="wind-speed"
                        class="weather-value">
                        --
                    </p>

                    <span>
                        km/h
                    </span>

                </article>

            </div>

            <p class="weather-time">

                Last updated:
                <time id="updated-time">
                    --
                </time>

            </p>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
