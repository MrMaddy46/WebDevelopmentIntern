<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Modern responsive e-commerce product catalog.">

    <meta name="theme-color"
        content="#2563eb">

    <title>ShopHub | Product Catalog</title>

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <!-- Header -->

    <header class="site-header">

        <div class="container header-inner">

            <a href="#/"
                class="logo"
                aria-label="ShopHub Home">

                ShopHub

            </a>

            <nav
                aria-label="Main navigation">

                <a href="#/">
                    Home
                </a>

                <a href="#/products">
                    Products
                </a>

                <a href="#/cart">
                    Cart
                    (<span id="cart-count">0</span>)
                </a>

            </nav>

        </div>

    </header>


    <!-- Main Application -->

    <main
        id="app"
        class="container"
        aria-live="polite">

    </main>


    <!-- Footer -->

    <footer>

        <div class="container">

            <p>
                © 2026 ShopHub. All Rights Reserved.
            </p>

        </div>

    </footer>


    <!-- JavaScript Modules -->

    <script
        type="module"
        src="js/app.js">
    </script>

</body>

</html>
